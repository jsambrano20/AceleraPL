<p>Alunos Acelera</p>
<table>
  <thead>
    <tr>
      <th>Nome</th>
      <th>Email</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let aluno of alunos">
      <td>{{aluno.nome}}</td>
      <td>{{aluno.email}}</td>
    </tr>
  </tbody>
</table>

<div>
  <ul>
    <li *ngFor="let aluno of alunos">
      <small>{{aluno.nome}}</small>
      <small>{{aluno.email}}</small>
    </li>
  </ul>
</div>
