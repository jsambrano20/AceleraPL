<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        label {
            display: block;
        }

        .field {
            width: 300px;
            margin: 0px auto;
            text-align: center;
        }
    </style>
</head>

<body>
    <form action="#" method="get" autocomplete="off">
        <fieldset class="field">
            <p>
                <label for="nome">Seu Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu Nome*" required>

            </p>
            <p>
                <label for="tel">Seu Telefone:</label>
                <input type="text" id="tel" name="tel" placeholder="Digite seu Telefone" required>

            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email">
            </p>
            <p>
                <label>Nascimento</label>
                <input type="date" id="dtnascimento" name="dtnascimento">
            </p>
            <p class="p-content">
                <label>Deseja receber nossas novidades?</label>
                Sim<input type="radio" id="Sim" name="novidades" value="Sim">
                Não<input type="radio" id="nao" name="novidades" value="nao">
            </p>
            <p>
                <label>Sua Mensagem:</label>
                <textarea type="Mensagem" id="Mensagem" rows="4" placeholder="Mensagem"></textarea>
            </p>
            <p>
                <button type="submit" id="btEnviar" name="btEnviar">
                    Enviar
                </button>
                <button type="reset" id="btreset" name="btreset">
                    Reset
                </button>
            </p>
        </fieldset>
    </form>
</body>

</html>
