<section class="container">
  <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/">Portal Alunos</a></li>
      <li class="breadcrumb-item active" aria-current="page">Cadastro Alunos</li>
    </ol>
  </nav>
  <form #form="ngForm" (ngSubmit)="submitForm(form)" method="post">
    <article>
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Cadastro Alunos</h5>
        </div>
        <div class="card-body">
          <div class="row">
            <div class="mb-3">
              <label for="fotoFile" class="form-label">Selecionar uma Imagem</label>
              <input class="form-control form-control-sm" id="fotoFile" type="file" (change)="onSelectFile($event)">
            </div>
            <button class="btn btn-primary" (click)="onUpload()">Enviar sua imagem</button>
          </div>
          <div class="col-md-9">
            <div class="col-sm-6 form-group">
              <label for="nome">Nome Aluno:</label>
              <input type="text" class="form-control" name="nome" id="nome" required [(ngModel)]="aluno.nome" ngModel>
              <span class="is-invalid" *ngIf="form.invalid">Campo Obrigatorio</span>
            </div>
            <div class="col-sm-6 form-group">
              <label for="email">Email Aluno:</label>
              <input type="email" class="form-control" name="email" id="email" required [(ngModel)]="aluno.email"
                ngModel>
              <span class="is-invalid" *ngIf="form.invalid">Campo Obrigatorio</span>
            </div>
            <div class="col-sm-6 form-group">
              <label for="telefone">Telefone Aluno:</label>
              <input type="text" class="form-control" name="telefone" maxlength="11" id="telefone"
                [(ngModel)]="aluno.telefone" ngModel>
            </div>
            <div class="col-sm-4 form-group">
              <label for="cpf">CPF Aluno:</label>
              <input type="text" class="form-control" name="cpf" id="cpf" required maxlength="14"
                [(ngModel)]="aluno.cpf" ngModel>
            </div>
            <div class="col-sm-4 form-group">
              <label for="rg">RG Aluno:</label>
              <input type="text" class="form-control" name="rg" id="rg" maxlength="10" [(ngModel)]="aluno.rg" ngModel>
            </div>
            <div class="col-sm-6 form-group">
              <label for="nascimento">Nascimento Aluno:</label>
              <input type="date" class="form-control" name="nascimento" required id="nascimento"
                [(ngModel)]="aluno.nascimento" ngModel>
            </div>
          </div>
          <div class=" row">
            {{mensagem}}
          </div>
        </div>
        <div class="card-footer">
          <button [disabled]="form.invalid" class="btn btn-primary">Enviar Dados</button>
        </div>
      </div>
    </article>



  </form>

</section>
{{aluno | json}}
