<section class="container">
  <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a routerLink="/">Portal Alunos</a></li>
      <li class="breadcrumb-item" aria-current="page">Cadastros</li>
      <li class="breadcrumb-item active" aria-current="page">Materias</li>
    </ol>
  </nav>
  <form #form="ngForm" (ngSubmit)="submitForm(form)" method="post">
    <article>
      <div class="card">
        <div class="card-header">
          <h5 class="card-title">Cadastrar Matéria</h5>
        </div>
        <div class="card-body">
          <div class="col-sm-6">
            <label for="materia">Matéria</label>
            <input type="text" name="materia" id="materia" class="form-control" [(ngModel)]="materias.materia" ngModel>
          </div>
          <div class="col-sm-12">
            <label for="descricao">Descrição</label>
            <textarea class="form-control" name="descricao" id="descricao" rows="4"
              [(ngModel)]="materias.descricao"></textarea>
          </div>
        </div>
        <div class="card-footer">
          <button class="btn btn-success"></button>
        </div>
      </div>
    </article>
  </form>
  <br>
  <article>
    <div class="card">
      <div class="card-header">
        <h5 class="card-title">Lista de Aulas</h5>
      </div>
      <div class="card-body">
        <table class="table">
          <thead class="thead-dark">
            <tr>
              <th>ID</th>
              <th>Matéria</th>
              <th>Descrição</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let materia of materiasFiltradas">
              <td>{{ materia.id }}</td>
              <td>{{ materia.materia }}</td>
              <td>{{ materia.descricao }}</td>
              <td><button class="btn btn-danger" (click)='removerAula(materia.id)'><i
                    class="fa-solid fa-trash"></i></button></td>
              <td><a routerLink="/Aulas/Editar/{{materia.id}}" class="btn btn-sm btn-info"><i
                    class="fa-solid fa-pen-to-square"></i></a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </article>
</section>
